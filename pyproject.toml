[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wmh-gmv-pca"
version = "0.1.0"
description = "Reproducible WMH and GMV normative spatial phenotyping"
requires-python = ">=3.11,<3.13"
dependencies = ["PyYAML>=6", "jsonschema>=4", "pandas>=2.2", "numpy>=1.26", "scipy>=1.13", "nibabel>=5.2", "nilearn>=0.11", "snakemake==9.27.1"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.8"]
build = ["cmake>=3.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
