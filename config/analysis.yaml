seed: 20261030
figures:
  width_px: 1200
  height_px: 800
  resolution: 120
  max_heatmap_features: 40
age_range: [50, 75]
normative:
  folds: 5
  age_spline_df: 3
  min_positive: 50
  cdf_clip: 0.000001
  max_cycles: 100
  prediction_interval: 0.90
pca:
  max_components: 10
  cv_repeats: 100
  mask_fraction: 0.05
  bootstrap_repeats: 200
  convergence_tolerance: 0.000001
  near_degenerate_ratio: 1.10
  angle_median_max: 15
  angle_p95_max: 30
  loading_similarity_min: 0.90
  score_icc_min: 0.80
acute:
  max_components: 2
  volume_spline_df: 3
  template: MNI152NLin6Asym
  expected_spatial_unit: mm
  probability_scale: 100
  allow_grid_resampling: true
  minimum_region_affected: 20
  minimum_region_fraction: 0.01
  binary_tolerance: 0.000001
  grid_affine_tolerance: 0.00001
clinical:
  visits: [3, 6, 12]
  age_spline_df: 3
  nihss_spline_df: 3
  acute_volume_spline_df: 3
  max_acute_components: 2
  max_chronic_components: 2
  nAGQ: 7
  validation_nAGQ: 11
  alpha: 0.05
  nominal_alpha: 0.01
  prediction_epsilon: 0.00000001
  exclude_conflicts: true
  use_nominal_visit_dates_for_death: false
  min_complete_cases: 30
  minimum_residual_subjects: 10
  gradient_tolerance: 0.001
  prediction_folds: 5
  calibration_bins: 10
  score_standardization: C3
  continuous_covariate_standardization: C3
  optimizer:
    method: ucminf
    relative_tolerance: 0.0000000001
    parameter_tolerance: 0.000000000001
    inner_gradient_tolerance: 0.0001
    outer_gradient_tolerance: 0.0001
    max_iterations: 1000
    max_evaluations: 2000
  enable_internal_validation: true
  covariates: [age, sex, prestroke_mrs, nihss, prior_stroke, hypertension, diabetes, af, ivt, evt]
